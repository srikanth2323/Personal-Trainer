/* Base */
/* --- UI density -------------------------------------------------------
   Spacing utilities are rem-based while several text sizes are px-based,
   so this root size controls how tight the whole UI feels.
   14px is the current setting. 15-16px = roomier, 13px = tighter.      */
html{font-size:14px}
/* --------------------------------------------------------------------- */
*,::before,::after{box-sizing:border-box;border-width:0;border-style:solid}
html,body{margin:0;padding:0;background-color:#000;height:100%;-webkit-text-size-adjust:100%}
body{
  font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  line-height:1.5;
  /* thinner, cleaner glyph rendering — this is most of the "crisp" difference */
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
/* Match Tailwind Preflight: reset chrome + padding, but keep the browser's

button{background-color:transparent;background-image:none;font-family:inherit;font-size:100%;font-weight:inherit;line-height:inherit;color:inherit;cursor:pointer;padding:0;margin:0}
input,select,textarea{font:inherit;color:inherit;margin:0}
a{color:inherit;text-decoration:none}

h1,h2,h3,p{margin:0}
ul{margin:0;padding:0;list-style:none}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

cardiovascular risk, which is a discussion for your doctor."},"Cholesterol - HDL":{what:"High-density lipoprotein cholesterol, which helps transport cholesterol back to the liver. Higher is generally viewed favourably.",raised:"Tends to be higher with regular aerobic exercise. Lower levels are associated with inactivity, smoking, excess weight and high triglycerides.",manage:"Aerobic activity and smoking cessation are the factors most consistently associated with improvement."},Triglycerides:{what:"A fat carried in the blood, used for energy storage.",raised:"Strongly affected by recent food and alcohol \u2014 a non-fasting sample reads higher. Also rises with excess refined carbohydrate, excess weight, poorly controlled diabetes and some medications.",manage:"Usually responds to reduced alcohol and refined sugar, weight management and regular activity. Fasting status matters when comparing results."},"Lipoprotein(a)":{what:"A lipoprotein particle whose level is largely genetically determined and fairly stable through life.",raised:"Mostly inherited. Unlike LDL, it changes little with diet or exercise.",manage:"Because it is genetic, it is generally used to refine overall risk assessment rather than treated directly. Usually measured once rather than tracked frequently."},"Apolipoprotein B":{what:"Counts the number of atherogenic particles rather than the cholesterol they carry, so it can add information beyond LDL.",raised:"Broadly tracks the same factors as LDL and triglycerides.",manage:"Managed with the same measures used for LDL."},HbA1c:{what:"Reflects average blood glucose over roughly the previous two to three months.",raised:"Rises with sustained high blood glucose. Can also read differently with anaemia, recent blood loss, or conditions affecting red-cell lifespan.",manage:"Commonly discussed in terms of carbohydrate quality and quantity, regular activity, weight, and sleep. Because it is an average, it moves slowly \u2014 retesting sooner than about three months rarely shows much."},"Blood Glucose (fasting)":{what:"Blood sugar after an overnight fast.",raised:"Affected by carbohydrate intake, stress hormones, poor sleep, illness, some medications (including steroids), and insufficient fasting before the test.",manage:"Usually reviewed together with HbA1c, since a single fasting value varies day to day."},"Uric Acid":{what:"A by-product of purine breakdown, cleared by the kidneys. High levels can crystallise in joints and cause gout.",raised:"Higher with alcohol (especially beer), purine-rich foods such as red meat and shellfish, fructose-sweetened drinks, dehydration, reduced kidney function and some diuretics.",manage:"Commonly addressed with hydration, reduced alcohol and fructose, weight management, and medication where gout is recurrent."},"Vitamin B12":{what:"A vitamin needed for red blood cell formation and nerve function. Stored in the liver, so deficiency develops slowly.",raised:"Low levels are common with vegetarian and vegan diets, reduced stomach acid, metformin use, and absorption problems. High readings are usually from supplementation.",manage:"Deficiency is typically corrected with oral or injected B12 depending on the cause. Worth reviewing alongside homocysteine, which rises when B12 is low."},"Vitamin D":{what:"Measured as 25-hydroxyvitamin D. Involved in calcium absorption, bone health and muscle function.",raised:"Low levels are very common with limited sun exposure, darker skin, indoor work, and higher body fat. Levels usually fall over winter.",manage:"Commonly addressed with sensible sun exposure and supplementation. Dose and duration are worth confirming with your doctor rather than guessing."},Ferritin:{what:"Reflects stored iron \u2014 usually the earliest marker to fall when iron is depleted.",raised:"Also an acute-phase reactant, so it rises with inflammation, infection and liver disease. That means a normal ferritin alongside inflammation can still hide low iron.",manage:"Low ferritin i
