/* Base */
/* --- UI density -------------------------------------------------------
   Spacing utilities are rem-based while several text sizes are px-based,
   so this root size controls how tight the whole UI feels.
   14px is the current setting. 15-16px = roomier, 13px = tighter.      */
html{font-size:14px}
/* --------------------------------------------------------------------- */
*,::before,::after{box-sizing:border-box;border-width:0;border-style:solid}
html,body{margin:0;padding:0;background-color:#000;height:100%;-webkit-text-size-adjust:100%}
body{
  font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  line-height:1.5;
  /* thinner, cleaner glyph rendering — this is most of the "crisp" difference */
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
/* Match Tailwind Preflight: reset chrome + padding, but keep the browser's
   default centred button text (Preflight does not override text-align). */
button{background-color:transparent;background-image:none;font-family:inherit;font-size:100%;font-weight:inherit;line-height:inherit;color:inherit;cursor:pointer;padding:0;margin:0}
input,select,textarea{font:inherit;color:inherit;margin:0}
a{color:inherit;text-decoration:none}
svg{display:block}
h1,h2,h3,p{margin:0}
ul{margin:0;padding:0;list-style:none}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
