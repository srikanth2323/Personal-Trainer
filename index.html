/* Base */
/* --- UI density -------------------------------------------------------
   Spacing utilities are rem-based while several text sizes are px-based,
   so this root size controls how tight the whole UI feels.
   14px is the current setting. 15-16px = roomier, 13px = tighter.      */
html{font-size:14px}
/* --------------------------------------------------------------------- */
*,::before,::after{box-sizing:border-box;border-width:0;border-style:solid}
html,body{margin:0;padding:0;background-color:#000;height:100%;-webkit-text-size-adjust:100%}
body{
  font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  line-height:1.5;
  /* thinner, cleaner glyph rendering — this is most of the "crisp" difference */
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
/* Match Tailwind Preflight: reset chrome + padding, but keep the browser's
   default centred button text (Preflight does not override text-align). */
button{background-color:transparent;background-image:none;font-family:inherit;font-size:100%;font-weight:inherit;line-height:inherit;color:inherit;cursor:pointer;padding:0;margin:0}
input,select,textarea{font:inherit;color:inherit;margin:0}
a{color:inherit;text-decoration:none}
svg{display:block}
h1,h2,h3,p{margin:0}
ul{margin:0;padding:0;list-style:none}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

holesterol - HDL":{what:"High-density lipoprotein cholesterol, which helps transport cholesterol back to the liver. Higher is generally viewed favourably.",raised:"Tends to be higher with regular aerobic exercise. Lower levels are associated with inactivity, smoking, excess weight and high triglycerides.",manage:"Aerobic activity and smoking cessation are the factors most consistently associated with improvement."},Triglycerides:{what:"A fat carried in the blood, used for energy storage.",raised:"Strongly affected by recent food and alcohol \u2014 a non-fasting sample reads higher. Also rises with excess refined carbohydrate, excess weight, poorly controlled diabetes and some medications.",manage:"Usually responds to reduced alcohol and refined sugar, weight management and regular activity. Fasting status matters when comparing results."},"Lipoprotein(a)":{what:"A lipoprotein particle whose level is largely genetically determined and fairly stable through life.",raised:"Mostly inherited. Unlike LDL, it changes little with diet or exercise.",manage:"Because it is genetic, it is generally used to refine overall risk assessment rather than treated directly. Usually measured once rather than tracked frequently."},"Apolipoprotein B":{what:"Counts the number of atherogenic particles rather than the cholesterol they carry, so it can add information beyond LDL.",raised:"Broadly tracks the same factors as LDL and triglycerides.",manage:"Managed with the same measures used for LDL."},HbA1c:{what:"Reflects average blood glucose over roughly the previous two to three months.",raised:"Rises with sustained high blood glucose. Can also read differently with anaemia, recent blood loss, or conditions affecting red-cell lifespan.",manage:"Commonly discussed in terms of carbohydrate quality and quantity, regular activity, weight, and sleep. Because it is an average, it moves slowly \u2014 retesting sooner than about three months rarely shows much."},"Blood Glucose (fasting)":{what:"Blood sugar after an overnight fast.",raised:"Affected by carbohydrate intake, stress hormones, poor sleep, illness, some medications (including steroids), and insufficient fasting before the test.",manage:"Usually reviewed together with HbA1c, since a single fasting value varies day to day."},"Uric Acid":{what:"A by-product of purine breakdown, cleared by the kidneys. High levels can crystallise in joints and cause gout.",raised:"Higher with alcohol (especially beer), purine-rich foods such as red meat and shellfish, fructose-sweetened drinks, dehydration, reduced kidney function and some diuretics.",manage:"Commonly addressed with hydration, reduced alcohol and fructose, weight management, and medication where gout is recurrent."},"Vitamin B12":{what:"A vitamin needed for red blood cell formation and nerve function. Stored in the liver, so deficiency develops slowly.",raised:"Low levels are common with vegetarian and vegan diets, reduced stomach acid, metformin use, and absorption problems. High readings are usually from supplementation.",manage:"Deficiency is typically corrected with oral or injected B12 depending on the cause. Worth reviewing alongside homocysteine, which rises when B12 is low."},"Vitamin D":{what:"Measured as 25-hydroxyvitamin D. Involved in calcium absorption, bone health and muscle function.",raised:"Low levels are very common with limited sun exposure, darker skin, indoor work, and higher body fat. Levels usually fall over winter.",manage:"Commonly addressed with sensible sun exposure and supplementation. Dose and duration are worth confirming with your doctor rather than guessing."},Ferritin:{what:"Reflects stored iron \u2014 usually the earliest marker to fall when iron is depleted.",raised:"Also an acute-phase reactant, so it rises with inflammation, infection and liver disease. That means a normal ferritin alongside inflammation can still hide low iron.",manage:"Low ferritin is generally investigated for a cause rather than just supplement r investigation."},"AST (SGOT)":{what:"An enzyme found in liver and also in muscle, so it is less liver-specific than ALT.",raised:"Rises with liver conditions but also after muscle damage or hard training, which is worth mentioning if you tested soon after a heavy session.",manage:"Usually interpreted alongside ALT \u2014 the ratio between them carries information."},AFP:{what:"Alpha-fetoprotein, a tumour marker used in monitoring certain cancers including some testicular tumours, and also in liver disease.",raised:"Can be raised by liver conditions as well as by tumour activity, so an elevated result is not specific on its own.",manage:"In surveillance, the trend across serial measurements is what is followed. Any change should go to your oncology team rather than being interpreted alone."},"Beta hCG":{what:"A hormone used as a tumour marker in the monitoring of certain testicular tumours.",raised:"Can be raised by tumour activity and, less commonly, by other causes including some medications and hypogonadism.",manage:"Followed as a trend during surveillance. Discuss any rise with your oncology team promptly rather than waiting for the next scheduled review."},LDH:{what:"Lactate dehydrogenase, an enzyme present in most tissues. Used alongside other markers in tumour surveillance.",raised:"Very non-specific \u2014 rises with muscle damage, intense exercise, haemolysis, infection and many other conditions, as well as tumour activity.",manage:"Because it is so non-specific, it is interpreted alongside AFP and beta-hCG and the wider clinical picture, not alone."},"Resting Heart Rate":{what:"Heart rate at complete rest \u2014 a broad indicator of cardiovascular fitness and autonomic state.",raised:"Higher with poor sleep, stress, illness, dehydration, alcohol, caffeine and overtraining. Falls with improving aerobic fitness.",manage:"A gradual downward trend with consistent training is generally viewed favourably. A sustained rise without explanation is worth mentioning
